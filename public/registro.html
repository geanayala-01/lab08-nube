<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro · TechStore</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <div class="brand"><span class="brand-logo">TS</span> TechStore</div>
      <h1>Crear cuenta</h1>
      <p class="subtitle">Las cuentas nuevas se crean con el rol <b>Empleado de Ventas</b>. El administrador puede cambiarlo.</p>

      <form id="form-registro" novalidate>
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="tienda">Tienda asignada</label>
        <select id="tienda" required>
          <option value="">Selecciona una tienda…</option>
        </select>

        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="new-password" required>
        <ul class="pw-rules" id="pw-rules">
          <li data-rule="len">Mínimo 8 caracteres</li>
          <li data-rule="upper">Al menos una mayúscula</li>
          <li data-rule="num">Al menos un número</li>
          <li data-rule="special">Al menos un carácter especial</li>
        </ul>

        <label for="password2">Confirmar contraseña</label>
        <input id="password2" type="password" autocomplete="new-password" required>

        <button type="submit" class="btn-block" id="btn-registro">Registrarme</button>
      </form>

      <div id="alerta" class="hidden"></div>

      <p class="footer-link">¿Ya tienes cuenta? <a href="/">Inicia sesión</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/registro.js"></script>
</body>
</html>
